name: Build upstream-core iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - ios-upstream-core
      - ios/a11-god-eater-a11-performance
      # Active rabbit / CodeRabbit experiment branches (A11 performance work).
      - coderabbit/**
      - rabbit-code/**
    paths:
      - "CMakeLists.txt"
      - "vcpkg.json"
      - "ios/**"
      - "vita3k/**"
      - "external/**"
      - ".ci/package-ios.sh"
      - ".ci/install-moltenvk.cmake"
      - ".github/workflows/ios-upstream.yml"
      - ".github/workflows/vulkan-checks.yml"
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "vcpkg.json"
      - "ios/**"
      - "vita3k/**"
      - "external/**"
      - ".ci/package-ios.sh"
      - ".ci/install-moltenvk.cmake"
      - ".github/workflows/ios-upstream.yml"
      - ".github/workflows/vulkan-checks.yml"

permissions:
  contents: read

# One active macOS IPA build per branch. New pushes cancel the previous run so
# jobs do not stack in the macos-15 runner queue (the main source of long
# "Queued" waits when several commits land in a short window).
concurrency:
  group: ios-upstream-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-support-tests:
    name: iOS startup and runtime regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build portable support tests with assertions enabled
        run: |
          cmake -S ios/tests -B build-native-tests -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-native-tests --parallel 2
          ctest --test-dir build-native-tests --output-on-failure --parallel 2

  unsigned-ipa:
    name: Upstream core arm64 device link
    needs: native-support-tests
    runs-on: macos-15
    # Cap wall time so a stuck vcpkg/Xcode step cannot hold a scarce macos-15
    # runner for three hours and starve the next build.
    timeout-minutes: 90

    steps:
      - name: Check out source and upstream dependencies
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Select Xcode 26 toolchain
        run: |
          xcode_apps=(/Applications/Xcode_26*.app)
          if [[ ! -d "${xcode_apps[0]}" ]]; then
            echo "::error::No Xcode 26 installation is present on this macos-15 runner."
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi
          selected_xcode="${xcode_apps[${#xcode_apps[@]}-1]}"
          echo "Selecting ${selected_xcode}"
          sudo xcode-select --switch "${selected_xcode}/Contents/Developer"
          xcode_ver="$(xcodebuild -version | head -1 | tr ' ' '-')"
          echo "XCODE_VER=${xcode_ver}" >> "$GITHUB_ENV"

      - name: Apply iOS submodule patches
        run: |
          git -C external/dynarmic apply --verbose \
            "${GITHUB_WORKSPACE}/ios/patches/0001-oaknut-ios-rwx-jit.patch"
          git -C external/dynarmic diff --check
          git -C external/dynarmic diff --name-only | grep -Fx \
            "externals/oaknut/include/oaknut/code_block.hpp"
          git -C external/dynarmic diff --name-only | grep -Fx \
            "src/dynarmic/backend/arm64/address_space.cpp"
          git -C external/dynarmic diff --name-only | grep -Fx \
            "src/dynarmic/common/spin_lock_arm64.cpp"

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK ${sdk_version}"
          [[ "${sdk_version%%.*}" -ge 26 ]] || {
            echo "::error::Selected Xcode does not provide an iOS 26 SDK (found ${sdk_version})."
            exit 1
          }
          cmake --version

      - name: Bootstrap pinned vcpkg
        run: |
          mkdir -p build-deps
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git build-deps/vcpkg
          git -C build-deps/vcpkg checkout 77df67cfff9c12ccfdb52284e07c87c75092f723
          ./build-deps/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=$PWD/build-deps/vcpkg" >> "$GITHUB_ENV"

      - name: Restore iOS vcpkg binary archive
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vcpkg/archives
          # Do NOT put github.run_id in the primary key — that forced every run
          # to miss the exact cache and re-download packages, stretching the
          # already scarce macos-15 job. Key only on toolchain + dependency set.
          key: vcpkg-arm64-ios-77df67c-${{ env.XCODE_VER }}-${{ hashFiles('vcpkg.json', 'ios/triplets/*.cmake') }}
          restore-keys: |
            vcpkg-arm64-ios-77df67c-${{ env.XCODE_VER }}-${{ hashFiles('vcpkg.json', 'ios/triplets/*.cmake') }}-
            vcpkg-arm64-ios-77df67c-${{ env.XCODE_VER }}-

      - name: Install pinned MoltenVK iOS package
        run: |
          cmake -P .ci/install-moltenvk.cmake
          MVK_ROOT="$PWD/build-deps/moltenvk/MoltenVK/MoltenVK"
          MVK_LIBRARY="$MVK_ROOT/static/MoltenVK.xcframework/ios-arm64/libMoltenVK.a"
          test -f "$MVK_LIBRARY"
          test -f "$MVK_ROOT/include/MoltenVK/mvk_vulkan.h"
          echo "VITA3K_IOS_MOLTENVK_LIBRARY=$MVK_LIBRARY" >> "$GITHUB_ENV"
          echo "VITA3K_IOS_MOLTENVK_INCLUDE_DIR=$MVK_ROOT/include" >> "$GITHUB_ENV"
          file "$MVK_LIBRARY"

      - name: Configure upstream core iOS application
        run: |
          cmake -S . -B build-ios-upstream -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-ios \
            -DVCPKG_OVERLAY_TRIPLETS="$PWD/ios/triplets" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DVITA3K_BUILD_IOS_UPSTREAM_CORE=ON \
            -DVITA3K_BUILD_IOS=OFF \
            -DVITA3K_IOS_DEPLOYMENT_TARGET=16.0 \
            -DVITA3K_IOS_LINK_CORE=ON \
            -DVITA3K_IOS_MOLTENVK_LIBRARY="$VITA3K_IOS_MOLTENVK_LIBRARY" \
            -DVITA3K_IOS_MOLTENVK_INCLUDE_DIR="$VITA3K_IOS_MOLTENVK_INCLUDE_DIR" \
            -DVITA3K_FORCE_SYSTEM_BOOST=ON \
            -DUSE_DISCORD_RICH_PRESENCE=OFF \
            -DUSE_VITA3K_UPDATE=OFF \
            -DUSE_LTO=NEVER

      - name: Save iOS vcpkg binary archive
        # Only write the cache when this run produced a miss; otherwise we
        # thrash the shared key and race other concurrent builds.
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-arm64-ios-77df67c-${{ env.XCODE_VER }}-${{ hashFiles('vcpkg.json', 'ios/triplets/*.cmake') }}

      - name: Build unsigned upstream-core device application
        run: |
          cmake --build build-ios-upstream \
            --config Release \
            --target Vita3KiOS \
            -- \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package and verify unsigned IPA
        run: |
          # Check both the bundle and linked binary: a newer SDK must not
          # silently raise the deployment floor above the A11's iOS 16.
          python3 - <<'PY'
          import pathlib
          import plistlib
          import re
          import subprocess

          app = pathlib.Path("build-ios-upstream/ios/Release-iphoneos/Vita3K-iOS.app")
          with (app / "Info.plist").open("rb") as stream:
              info = plistlib.load(stream)
          def version(value):
              parts = tuple(map(int, value.split(".")))
              return parts + (0,) * (3 - len(parts))
          if version(info["MinimumOSVersion"]) > (16, 0, 0) or 1 not in info["UIDeviceFamily"]:
              raise SystemExit("App bundle is not compatible with iOS 16 iPhones")
          binary = app / info["CFBundleExecutable"]
          subprocess.run(["lipo", "-verify_arch", "arm64", str(binary)], check=True)
          build_info = subprocess.check_output(["xcrun", "vtool", "-show-build", str(binary)], text=True)
          minimums = re.findall(r"platform\s+IOS\s+minos\s+([0-9.]+)", build_info)
          if not minimums or any(version(value) > (16, 0, 0) for value in minimums):
              raise SystemExit("Linked executable does not target iOS 16 devices")
          print("Verified arm64 iPhone binary and iOS 16 deployment target")
          PY
          mkdir -p artifacts
          bash ./.ci/package-ios.sh \
            --build-dir build-ios-upstream \
            --configuration Release \
            --output artifacts/Vita3K-upstream-core-iOS-unsigned.ipa

      - name: Upload unsigned upstream-core IPA
        uses: actions/upload-artifact@v4
        with:
          name: Vita3K-upstream-core-iOS-${{ github.sha }}-unsigned
          path: artifacts/Vita3K-upstream-core-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-core-build-diagnostics-${{ github.sha }}
          path: |
            build-ios-upstream/CMakeFiles/CMakeConfigureLog.yaml
            build-ios-upstream/vcpkg-manifest-install.log
            build-ios-upstream/vcpkg_installed/vcpkg/issue_body.md
          if-no-files-found: ignore
          retention-days: 7
